        // 绘制背景
        function drawBackground() {
            // 根据天气调整背景色
            let bgColor;
            if (weather === 'rain') {
                bgColor = '#16213e';
            } else if (weather === 'snow') {
                bgColor = '#2c3e50';
            } else {
                bgColor = '#0d0d1a';
            }
            
            // 创建渐变背景
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, bgColor);
            gradient.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格背景效果
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }
            
            // 绘制左侧小孔
            ctx.beginPath();
            ctx.arc(20, canvas.height / 2, 15, 0, Math.PI * 2);
            const holeGradient = ctx.createRadialGradient(20, canvas.height / 2, 0, 20, canvas.height / 2, 15);
            holeGradient.addColorStop(0, '#0f0f1a');
            holeGradient.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = holeGradient;
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // 绘制天气效果
            drawWeather();
        }

        // 绘制天气效果
        function drawWeather() {
            if (weather === 'rain') {
                ctx.strokeStyle = 'rgba(174, 194, 224, 0.6)';
                ctx.lineWidth = 2;
                weatherParticles.forEach(particle => {
                    ctx.beginPath();
                    ctx.moveTo(particle.x, particle.y);
                    ctx.lineTo(particle.x, particle.y + particle.length);
                    ctx.stroke();
                });
            } else if (weather === 'snow') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                weatherParticles.forEach(particle => {
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        }

        // 绘制目标物品
        function drawRedBalls() {
            redBalls.forEach(ball => {
                if (ball.visible) {
                    // 绘制发光效果
                    const glowGradient = ctx.createRadialGradient(
                        ball.x, ball.y, 0,
                        ball.x, ball.y, ball.radius * 1.5
                    );
                    glowGradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                    glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.radius * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = glowGradient;
                    ctx.fill();

                    // 普通emoji绘制
                    ctx.font = `${RED_BALL_RADIUS * 2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(ball.emoji, ball.x, ball.y);
                }
            });
        }

        // 绘制白色球
        function drawWhiteBall() {
            if (!whiteBall.active && gameState === 'waiting') {
                // 在小孔中显示
                ctx.beginPath();
                ctx.arc(20, canvas.height / 2, whiteBall.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            } else if (whiteBall.active) {
                // 发光效果
                const glowGradient = ctx.createRadialGradient(
                    whiteBall.x, whiteBall.y, 0,
                    whiteBall.x, whiteBall.y, whiteBall.radius * 2
                );
                glowGradient.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
                glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.beginPath();
                ctx.arc(whiteBall.x, whiteBall.y, whiteBall.radius * 2, 0, Math.PI * 2);
                ctx.fillStyle = glowGradient;
                ctx.fill();
                
                // 球体
                const gradient = ctx.createRadialGradient(
                    whiteBall.x - whiteBall.radius / 3,
                    whiteBall.y - whiteBall.radius / 3,
                    0,
                    whiteBall.x,
                    whiteBall.y,
                    whiteBall.radius
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, '#b0b0b0');
                
                ctx.beginPath();
                ctx.arc(whiteBall.x, whiteBall.y, whiteBall.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 高光
                ctx.beginPath();
                ctx.arc(whiteBall.x - whiteBall.radius / 3, whiteBall.y - whiteBall.radius / 3, whiteBall.radius / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            }
        }

        // 绘制无人机（军用四旋翼侦察无人机）
        function drawDrones() {
            drones.forEach(drone => {
                const scale = drone.scale || 1;

                // 应用缩放
                ctx.save();
                ctx.translate(drone.x, drone.y);
                ctx.scale(scale, scale);
                ctx.translate(-drone.x, -drone.y);

                // 四个旋翼臂（X型布局）
                const armAngles = [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4];
                
                armAngles.forEach((armAngle, index) => {
                    const armStartX = drone.x + Math.cos(armAngle) * 15;
                    const armStartY = drone.y + Math.sin(armAngle) * 15;
                    const armEndX = drone.x + Math.cos(armAngle) * 50;
                    const armEndY = drone.y + Math.sin(armAngle) * 50;

                    // 碳纤维旋翼臂
                    ctx.beginPath();
                    ctx.moveTo(armStartX, armStartY);
                    ctx.lineTo(armEndX, armEndY);
                    const armGradient = ctx.createLinearGradient(armStartX, armStartY, armEndX, armEndY);
                    armGradient.addColorStop(0, '#2d2d2d');
                    armGradient.addColorStop(0.5, '#1a1a1a');
                    armGradient.addColorStop(1, '#0d0d0d');
                    ctx.strokeStyle = armGradient;
                    ctx.lineWidth = 8;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // 旋翼臂高光
                    ctx.beginPath();
                    ctx.moveTo(armStartX, armStartY - 2);
                    ctx.lineTo(armEndX, armEndY - 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // 电机外壳
                    ctx.beginPath();
                    ctx.arc(armEndX, armEndY, 10, 0, Math.PI * 2);
                    const motorGradient = ctx.createRadialGradient(armEndX - 3, armEndY - 3, 0, armEndX, armEndY, 10);
                    motorGradient.addColorStop(0, '#3d3d3d');
                    motorGradient.addColorStop(0.7, '#1a1a1a');
                    motorGradient.addColorStop(1, '#0a0a0a');
                    ctx.fillStyle = motorGradient;
                    ctx.fill();
                    ctx.strokeStyle = '#4a4a4a';
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // 旋翼叶片（快速旋转效果）
                    const rotorOffset = Date.now() * 0.05 * (index % 2 === 0 ? 1 : -1);
                    ctx.save();
                    ctx.translate(armEndX, armEndY);
                    ctx.rotate(rotorOffset);
                    
                    // 旋翼1
                    ctx.beginPath();
                    ctx.ellipse(0, -15, 4, 18, 0, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(100, 100, 100, 0.9)';
                    ctx.fill();
                    
                    // 旋翼2（垂直）
                    ctx.beginPath();
                    ctx.ellipse(15, 0, 18, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // 旋翼模糊圆环
                    ctx.beginPath();
                    ctx.arc(0, 0, 16, 0, Math.PI * 2);
                    const blurGradient = ctx.createRadialGradient(0, 0, 8, 0, 0, 16);
                    blurGradient.addColorStop(0, 'rgba(200, 200, 200, 0.3)');
                    blurGradient.addColorStop(0.7, 'rgba(150, 150, 150, 0.15)');
                    blurGradient.addColorStop(1, 'rgba(100, 100, 100, 0)');
                    ctx.fillStyle = blurGradient;
                    ctx.fill();
                    
                    ctx.restore();

                    // 旋翼发光点（夜间模式）
                    const ledIntensity = 0.5 + Math.sin(Date.now() * 0.01 + index) * 0.5;
                    ctx.beginPath();
                    ctx.arc(armEndX + Math.cos(armAngle) * 12, armEndY + Math.sin(armAngle) * 12, 3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 0, ${ledIntensity})`;
                    ctx.fill();
                    ctx.shadowColor = '#00ff00';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // 中央机身主体（六边形）
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI * 2 / 6) * i + Math.PI / 6;
                    const x = drone.x + Math.cos(angle) * 20;
                    const y = drone.y + Math.sin(angle) * 20;
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();

                // 机身主体渐变（军用迷彩灰）
                const bodyGradient = ctx.createLinearGradient(drone.x - 20, drone.y - 20, drone.x + 20, drone.y + 20);
                bodyGradient.addColorStop(0, '#4a4a4a');
                bodyGradient.addColorStop(0.3, '#2d2d2d');
                bodyGradient.addColorStop(0.7, '#1a1a1a');
                bodyGradient.addColorStop(1, '#0d0d0d');
                ctx.fillStyle = bodyGradient;
                ctx.fill();

                // 机身边框
                ctx.strokeStyle = '#5a5a5a';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 机身纹理（防滑表面）
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    const angle = (Math.PI * 2 / 4) * i + Math.PI / 8;
                    ctx.beginPath();
                    ctx.moveTo(
                        drone.x + Math.cos(angle) * 8,
                        drone.y + Math.sin(angle) * 8
                    );
                    ctx.lineTo(
                        drone.x + Math.cos(angle) * 18,
                        drone.y + Math.sin(angle) * 18
                    );
                    ctx.stroke();
                }

                // 底部摄像头球体
                ctx.beginPath();
                ctx.arc(drone.x, drone.y + 5, 8, 0, Math.PI * 2);
                const cameraGradient = ctx.createRadialGradient(drone.x - 2, drone.y + 3, 0, drone.x, drone.y + 5, 8);
                cameraGradient.addColorStop(0, '#2a2a2a');
                cameraGradient.addColorStop(0.6, '#1a1a1a');
                cameraGradient.addColorStop(1, '#0a0a0a');
                ctx.fillStyle = cameraGradient;
                ctx.fill();
                ctx.strokeStyle = '#3a3a3a';
                ctx.lineWidth = 1;
                ctx.stroke();

                // 摄像头镜头
                ctx.beginPath();
                ctx.arc(drone.x, drone.y + 5, 5, 0, Math.PI * 2);
                const lensGradient = ctx.createRadialGradient(drone.x - 1, drone.y + 4, 0, drone.x, drone.y + 5, 5);
                lensGradient.addColorStop(0, '#1e3a5f');
                lensGradient.addColorStop(0.7, '#0f1f3a');
                lensGradient.addColorStop(1, '#050f1a');
                ctx.fillStyle = lensGradient;
                ctx.fill();

                // 镜头反光
                ctx.beginPath();
                ctx.arc(drone.x - 2, drone.y + 3, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fill();

                // 顶部GPS天线
                ctx.beginPath();
                ctx.arc(drone.x, drone.y - 12, 4, 0, Math.PI * 2);
                const antennaGradient = ctx.createRadialGradient(drone.x - 1, drone.y - 13, 0, drone.x, drone.y - 12, 4);
                antennaGradient.addColorStop(0, '#3d3d3d');
                antennaGradient.addColorStop(1, '#1d1d1d');
                ctx.fillStyle = antennaGradient;
                ctx.fill();
                ctx.strokeStyle = '#4d4d4d';
                ctx.lineWidth = 1;
                ctx.stroke();

                // LED状态灯（红色闪烁）
                const blink = Math.sin(Date.now() * 0.01) > 0;
                ctx.beginPath();
                ctx.arc(drone.x - 12, drone.y - 8, 3, 0, Math.PI * 2);
                ctx.fillStyle = blink ? '#ff0000' : '#330000';
                ctx.fill();
                if (blink) {
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // 绿色LED（右侧）
                ctx.beginPath();
                ctx.arc(drone.x + 12, drone.y - 8, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#00ff00';
                ctx.fill();
                ctx.shadowColor = '#00ff00';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;

                // 激光瞄准线（侦察模式）
                if (blink) {
                    ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(drone.x, drone.y + 13);
                    ctx.lineTo(drone.x, drone.y + 60);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 激光点
                    ctx.beginPath();
                    ctx.arc(drone.x, drone.y + 60, 4, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
                    ctx.fill();
                }

                // 恢复缩放
                ctx.restore();
            });
        }

        // 绘制子弹
        function drawBullets() {
            bullets.forEach(bullet => {
                ctx.shadowColor = '#ffff00';
                ctx.shadowBlur = 10;
                
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
                const bulletGradient = ctx.createRadialGradient(
                    bullet.x, bullet.y, 0,
                    bullet.x, bullet.y, 4
                );
                bulletGradient.addColorStop(0, '#ffffff');
                bulletGradient.addColorStop(1, '#ffff00');
                ctx.fillStyle = bulletGradient;
                ctx.fill();
                
                ctx.shadowBlur = 0;
            });
        }

        // 绘制挡板
        function drawPaddle() {
            paddle.time += 0.05;
            const style = paddle.style;
            
            // 外发光
            ctx.shadowColor = style.glow;
            ctx.shadowBlur = 20;
            
            // 挡板渐变
            const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
            gradient.addColorStop(0, style.color1);
            gradient.addColorStop(1, style.color2);
            
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fillStyle = gradient;
            ctx.fill();
            
            // 根据风格绘制图案
            if (style.pattern === 'neon') {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                for (let i = 0; i < paddle.width - 20; i += 15) {
                    const x = paddle.x + 10 + i;
                    ctx.beginPath();
                    ctx.moveTo(x, paddle.y + paddle.height / 2);
                    ctx.lineTo(x + 5, paddle.y + paddle.height / 2);
                    ctx.stroke();
                }
            } else if (style.pattern === 'cyber') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                for (let i = 0; i < paddle.width - 20; i += 20) {
                    const x = paddle.x + 10 + i;
                    ctx.beginPath();
                    ctx.rect(x, paddle.y + 3, 10, paddle.height - 6);
                    ctx.fill();
                }
            } else if (style.pattern === 'cosmic') {
                for (let i = 0; i < 3; i++) {
                    const x = paddle.x + paddle.width * (i + 1) / 4;
                    ctx.beginPath();
                    ctx.arc(x, paddle.y + paddle.height / 2, 3 + Math.sin(paddle.time + i) * 2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + Math.sin(paddle.time + i) * 0.3})`;
                    ctx.fill();
                }
            } else if (style.pattern === 'pastel') {
                ctx.beginPath();
                ctx.moveTo(paddle.x + paddle.width / 2, paddle.y + paddle.height / 2);
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI * 2 / 6) * i + paddle.time * 0.5;
                    const r = 8 + Math.sin(paddle.time * 2 + i) * 3;
                    ctx.lineTo(
                        paddle.x + paddle.width / 2 + Math.cos(angle) * r,
                        paddle.y + paddle.height / 2 + Math.sin(angle) * r
                    );
                }
                ctx.closePath();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            ctx.shadowBlur = 0;
            
            // 高光
            const highlightGradient = ctx.createLinearGradient(
                paddle.x + 5, paddle.y + 2,
                paddle.x + 5, paddle.y + paddle.height - 2
            );
            highlightGradient.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
            highlightGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.beginPath();
            ctx.roundRect(paddle.x + 5, paddle.y + 2, 4, paddle.height - 4, 2);
            ctx.fillStyle = highlightGradient;
            ctx.fill();
        }

        // 绘制爆炸效果
        function drawExplosions() {
            explosions.forEach(exp => {
                exp.particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;

                    // 炸弹爆炸时的额外发光效果
                    if (exp.isBomb) {
                        ctx.shadowColor = `rgba(${p.color}, ${p.alpha * 0.8})`;
                        ctx.shadowBlur = 10;
                    }

                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // 炸弹爆炸时的中心冲击波
                if (exp.isBomb && exp.age < 15) {
                    const shockwaveRadius = (exp.age * 15);
                    const shockwaveAlpha = 1 - (exp.age / 15);

                    ctx.beginPath();
                    ctx.arc(
                        exp.particles[0].x,
                        exp.particles[0].y,
                        shockwaveRadius,
                        0,
                        Math.PI * 2
                    );
                    ctx.strokeStyle = `rgba(255, 150, 0, ${shockwaveAlpha * 0.5})`;
                    ctx.lineWidth = 4;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(
                        exp.particles[0].x,
                        exp.particles[0].y,
                        shockwaveRadius * 0.6,
                        0,
                        Math.PI * 2
                    );
                    ctx.strokeStyle = `rgba(255, 200, 0, ${shockwaveAlpha * 0.3})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            });
        }

        // 绘制炸弹
        function drawBombs() {
            bombs.forEach(bomb => {
                const isDroneMissile = bomb.isDroneMissile;

                if (isDroneMissile) {
                    // 导弹外观（科技感）
                    const pulseIntensity = 0.7 + Math.sin(Date.now() * 0.015) * 0.3;
                    ctx.shadowColor = `rgba(0, 255, 255, ${pulseIntensity})`;
                    ctx.shadowBlur = 20 + Math.sin(Date.now() * 0.015) * 8;

                    // 导弹主体（长椭圆）
                    ctx.beginPath();
                    ctx.ellipse(bomb.x, bomb.y, bomb.radius * 0.8, bomb.radius, 0, 0, Math.PI * 2);
                    const missileGradient = ctx.createLinearGradient(bomb.x, bomb.y - bomb.radius, bomb.x, bomb.y + bomb.radius);
                    missileGradient.addColorStop(0, '#4a90e2');
                    missileGradient.addColorStop(0.5, '#2c5aa0');
                    missileGradient.addColorStop(1, '#1e3a5f');
                    ctx.fillStyle = missileGradient;
                    ctx.fill();

                    // 导弹边框
                    ctx.strokeStyle = '#5dade2';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // 导弹头部
                    ctx.beginPath();
                    ctx.moveTo(bomb.x - bomb.radius * 0.8, bomb.y - bomb.radius * 0.3);
                    ctx.lineTo(bomb.x, bomb.y - bomb.radius - 5);
                    ctx.lineTo(bomb.x + bomb.radius * 0.8, bomb.y - bomb.radius * 0.3);
                    ctx.closePath();
                    ctx.fillStyle = '#2ecc71';
                    ctx.fill();

                    // 导弹尾部喷射
                    const exhaustX = bomb.x;
                    const exhaustY = bomb.y + bomb.radius;

                    // 尾焰核心
                    const exhaustGradient = ctx.createRadialGradient(exhaustX, exhaustY, 0, exhaustX, exhaustY + 30, 30);
                    exhaustGradient.addColorStop(0, '#ffffff');
                    exhaustGradient.addColorStop(0.2, '#00ffff');
                    exhaustGradient.addColorStop(0.5, '#0099ff');
                    exhaustGradient.addColorStop(1, 'rgba(0, 100, 200, 0)');

                    ctx.beginPath();
                    ctx.ellipse(exhaustX, exhaustY + 15, 12, 25, 0, 0, Math.PI * 2);
                    ctx.fillStyle = exhaustGradient;
                    ctx.fill();

                    // 尾焰粒子
                    for (let i = 0; i < 5; i++) {
                        const particleAngle = (Math.PI / 2 + (Math.random() - 0.5) * 0.5);
                        const particleDist = 25 + Math.random() * 20;
                        const particleX = exhaustX + Math.sin(particleAngle) * (Math.random() - 0.5) * 20;
                        const particleY = exhaustY + particleDist;

                        ctx.beginPath();
                        ctx.arc(particleX, particleY, 2 + Math.random() * 2, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(0, 255, 255, ${0.8 - particleDist / 45})`;
                        ctx.fill();
                    }

                    // 导弹侧翼
                    ctx.fillStyle = '#1e3a5f';
                    ctx.strokeStyle = '#5dade2';
                    ctx.lineWidth = 1;

                    // 左翼
                    ctx.beginPath();
                    ctx.moveTo(bomb.x - bomb.radius * 0.5, bomb.y + bomb.radius * 0.5);
                    ctx.lineTo(bomb.x - bomb.radius * 1.2, bomb.y + bomb.radius + 8);
                    ctx.lineTo(bomb.x - bomb.radius * 0.3, bomb.y + bomb.radius * 0.8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // 右翼
                    ctx.beginPath();
                    ctx.moveTo(bomb.x + bomb.radius * 0.5, bomb.y + bomb.radius * 0.5);
                    ctx.lineTo(bomb.x + bomb.radius * 1.2, bomb.y + bomb.radius + 8);
                    ctx.lineTo(bomb.x + bomb.radius * 0.3, bomb.y + bomb.radius * 0.8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // 导弹上的科技图案
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(bomb.x - 5, bomb.y - 5);
                    ctx.lineTo(bomb.x + 5, bomb.y);
                    ctx.lineTo(bomb.x - 5, bomb.y + 5);
                    ctx.stroke();

                    // 导弹尾部的警示灯
                    const blink = Math.sin(Date.now() / 80) > 0;
                    ctx.beginPath();
                    ctx.arc(bomb.x, bomb.y + bomb.radius - 5, 3, 0, Math.PI * 2);
                    ctx.fillStyle = blink ? '#ff0000' : '#660000';
                    ctx.fill();

                } else {
                    // 真实炸弹（高爆炸弹样式）
                    
                    // 炸弹主体（圆柱形）
                    const bodyWidth = bomb.radius * 1.6;
                    const bodyHeight = bomb.radius * 2;
                    const bodyX = bomb.x - bodyWidth / 2;
                    const bodyY = bomb.y - bodyHeight / 2;

                    // 弹体渐变（军用橄榄绿/深灰色）
                    const bodyGradient = ctx.createLinearGradient(bodyX, bodyY, bodyX + bodyWidth, bodyY);
                    bodyGradient.addColorStop(0, '#3d3d3d');
                    bodyGradient.addColorStop(0.3, '#4a4a4a');
                    bodyGradient.addColorStop(0.5, '#2d2d2d');
                    bodyGradient.addColorStop(0.7, '#4a4a4a');
                    bodyGradient.addColorStop(1, '#3d3d3d');
                    
                    ctx.beginPath();
                    ctx.ellipse(bodyX, bodyY + bodyHeight / 2, 8, bodyHeight / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.fillStyle = bodyGradient;
                    ctx.fillRect(bodyX, bodyY, bodyWidth, bodyHeight);
                    
                    ctx.beginPath();
                    ctx.ellipse(bodyX + bodyWidth, bodyY + bodyHeight / 2, 8, bodyHeight / 2, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // 弹体顶部圆形
                    ctx.beginPath();
                    ctx.ellipse(bomb.x, bodyY, bodyWidth / 2, 8, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#4a4a4a';
                    ctx.fill();

                    // 弹体底部圆形
                    ctx.beginPath();
                    ctx.ellipse(bomb.x, bodyY + bodyHeight, bodyWidth / 2, 8, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#2d2d2d';
                    ctx.fill();

                    // 弹体金属光泽
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(bodyX + bodyWidth * 0.25, bodyY);
                    ctx.lineTo(bodyX + bodyWidth * 0.25, bodyY + bodyHeight);
                    ctx.stroke();

                    // 炸弹引信管（金属色）
                    const fuseWidth = 12;
                    const fuseHeight = 25;
                    const fuseX = bomb.x - fuseWidth / 2;
                    const fuseY = bodyY - fuseHeight;

                    ctx.fillStyle = '#5a5a5a';
                    ctx.fillRect(fuseX, fuseY, fuseWidth, fuseHeight);
                    
                    // 引信管螺纹
                    ctx.strokeStyle = '#4a4a4a';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 4; i++) {
                        ctx.beginPath();
                        ctx.moveTo(fuseX, fuseY + 5 + i * 5);
                        ctx.lineTo(fuseX + fuseWidth, fuseY + 5 + i * 5);
                        ctx.stroke();
                    }

                    // 引信管顶部
                    ctx.beginPath();
                    ctx.arc(bomb.x, fuseY, fuseWidth / 2, 0, Math.PI * 2);
                    const fuseTopGradient = ctx.createRadialGradient(bomb.x - 2, fuseY - 2, 0, bomb.x, fuseY, fuseWidth / 2);
                    fuseTopGradient.addColorStop(0, '#6a6a6a');
                    fuseTopGradient.addColorStop(1, '#4a4a4a');
                    ctx.fillStyle = fuseTopGradient;
                    ctx.fill();

                    // 真实的引线（燃着的导火索）
                    const fuseEndX = bomb.x;
                    const fuseEndY = fuseY;
                    
                    // 引线路径（弯曲的，像真实的导火索）
                    ctx.beginPath();
                    ctx.moveTo(fuseEndX, fuseEndY);
                    ctx.quadraticCurveTo(
                        fuseEndX + 8,
                        fuseEndY - 10,
                        fuseEndX + 3,
                        fuseEndY - 20
                    );
                    ctx.quadraticCurveTo(
                        fuseEndX - 5,
                        fuseEndY - 28,
                        fuseEndX + 2,
                        fuseEndY - 35
                    );
                    
                    // 引线渐变（从金属色到燃烧色）
                    const fuseGradient = ctx.createLinearGradient(fuseEndX, fuseEndY, fuseEndX + 2, fuseEndY - 35);
                    fuseGradient.addColorStop(0, '#8b7355');
                    fuseGradient.addColorStop(0.6, '#6b5344');
                    fuseGradient.addColorStop(1, '#4b3324');
                    ctx.strokeStyle = fuseGradient;
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    // 引线燃烧端点（正在燃烧的火星）
                    const burningX = fuseEndX + 2;
                    const burningY = fuseEndY - 35;

                    // 燃烧核心（白色到黄色）
                    const burnCoreGradient = ctx.createRadialGradient(burningX, burningY, 0, burningX, burningY, 6);
                    burnCoreGradient.addColorStop(0, '#ffffff');
                    burnCoreGradient.addColorStop(0.3, '#ffff00');
                    burnCoreGradient.addColorStop(0.7, '#ff8800');
                    burnCoreGradient.addColorStop(1, 'rgba(255, 68, 0, 0)');
                    
                    ctx.beginPath();
                    ctx.arc(burningX, burningY, 6, 0, Math.PI * 2);
                    ctx.fillStyle = burnCoreGradient;
                    ctx.fill();

                    // 燃烧火星（真实的火花效果）
                    const sparkCount = 12;
                    for (let i = 0; i < sparkCount; i++) {
                        const angle = (Math.PI * 2 / sparkCount) * i + Date.now() * 0.02;
                        const distance = 8 + Math.random() * 8;
                        const sparkX = burningX + Math.cos(angle) * distance;
                        const sparkY = burningY + Math.sin(angle) * distance - 3;
                        const sparkSize = 1 + Math.random() * 2;
                        
                        ctx.beginPath();
                        ctx.arc(sparkX, sparkY, sparkSize, 0, Math.PI * 2);
                        const sparkColors = ['#ffffff', '#ffff00', '#ff8800', '#ff4400'];
                        ctx.fillStyle = sparkColors[Math.floor(Math.random() * sparkColors.length)];
                        ctx.fill();
                    }

                    // 升腾的烟（真实烟雾效果）
                    for (let i = 0; i < 5; i++) {
                        const smokeAngle = -Math.PI / 2 + (Math.random() - 0.5) * 0.5;
                        const smokeDist = 15 + Math.random() * 10;
                        const smokeX = burningX + Math.cos(smokeAngle) * smokeDist;
                        const smokeY = burningY + Math.sin(smokeAngle) * smokeDist;
                        const smokeSize = 3 + Math.random() * 3;
                        
                        ctx.beginPath();
                        ctx.arc(smokeX, smokeY, smokeSize, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(100, 100, 100, ${0.3 + Math.random() * 0.2})`;
                        ctx.fill();
                    }

                    // 炸弹上的警告标识（骷髅头）
                    ctx.fillStyle = '#ff4444';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('⚠', bomb.x, bodyY + bodyHeight / 2);

                    // 军用编号
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '6px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('M-67', bomb.x, bodyY + bodyHeight / 2 + 12);

                    // 弹体纹理（凹凸感）
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(bodyX + 5, bodyY + 10 + i * 8);
                        ctx.lineTo(bodyX + bodyWidth - 5, bodyY + 10 + i * 8);
                        ctx.stroke();
                    }
                }
            });
        }

        // 绘制小白球
        function drawSmallBalls() {
            smallBalls.forEach(ball => {
                // 发光效果
                const glowGradient = ctx.createRadialGradient(
                    ball.x, ball.y, 0,
                    ball.x, ball.y, ball.radius * 2
                );
                glowGradient.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
                glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius * 2, 0, Math.PI * 2);
                ctx.fillStyle = glowGradient;
                ctx.fill();
                
                // 球体
                const gradient = ctx.createRadialGradient(
                    ball.x - ball.radius / 3,
                    ball.y - ball.radius / 3,
                    0,
                    ball.x,
                    ball.y,
                    ball.radius
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(1, '#b0b0b0');
                
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 高光
                ctx.beginPath();
                ctx.arc(ball.x - ball.radius / 3, ball.y - ball.radius / 3, ball.radius / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fill();
            });
        }

        // 更新游戏逻辑
        function update() {
            // 更新天气粒子
            if (weather === 'rain') {
                weatherParticles.forEach(particle => {
                    particle.y += particle.speed;
                    if (particle.y > canvas.height) {
                        particle.y = -particle.length;
                        particle.x = Math.random() * canvas.width;
                    }
                });
            } else if (weather === 'snow') {
                weatherParticles.forEach(particle => {
                    particle.y += particle.speed;
                    particle.x += particle.drift;
                    if (particle.y > canvas.height) {
                        particle.y = -particle.radius;
                        particle.x = Math.random() * canvas.width;
                    }
                    if (particle.x < 0 || particle.x > canvas.width) {
                        particle.drift = -particle.drift;
                    }
                });
            }

            // 更新爆炸效果
            updateExplosions();

            // 更新小白球
            updateSmallBalls();

            // 更新炸弹位置和检测
            updateBombs();

            // 更新无人机和子弹
            updateDronesAndBullets();

            if (gameState !== 'playing') return;

            // 移动挡板
            if (leftPressed && paddle.x > 0) {
                paddle.x -= paddle.speed;
            }
            if (rightPressed && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
            }

            // 更新白球位置
            if (whiteBall.active) {
                whiteBall.vy += GRAVITY;
                whiteBall.x += whiteBall.vx;
                whiteBall.y += whiteBall.vy;

                // 左右边界碰撞
                if (whiteBall.x - whiteBall.radius < 0 || whiteBall.x + whiteBall.radius > canvas.width) {
                    playWallSound();
                    whiteBall.vx = -whiteBall.vx;
                    if (whiteBall.x - whiteBall.radius < 0) {
                        whiteBall.x = whiteBall.radius;
                    }
                    if (whiteBall.x + whiteBall.radius > canvas.width) {
                        whiteBall.x = canvas.width - whiteBall.radius;
                    }
                }

                // 上边界碰撞
                if (whiteBall.y - whiteBall.radius < 0) {
                    playWallSound();
                    whiteBall.vy = -whiteBall.vy;
                    whiteBall.y = whiteBall.radius;
                }

                // 检测挡板碰撞
                if (whiteBall.y + whiteBall.radius > paddle.y &&
                    whiteBall.y - whiteBall.radius < paddle.y + paddle.height &&
                    whiteBall.x > paddle.x &&
                    whiteBall.x < paddle.x + paddle.width) {
                    
                    playPaddleSound();
                    whiteBall.vy = BOUNCE_POWER;
                    const hitPos = (whiteBall.x - paddle.x) / paddle.width;
                    whiteBall.vx = (hitPos - 0.5) * 8;
                    whiteBall.y = paddle.y - whiteBall.radius;
                }

                // 检测目标碰撞
                redBalls.forEach(ball => {
                    if (ball.visible) {
                        const dx = whiteBall.x - ball.x;
                        const dy = whiteBall.y - ball.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < whiteBall.radius + ball.radius) {
                            ball.visible = false;
                            playHitSound();
                            playExplosionSound();
                            playGrowSound();
                            paddle.width = Math.min(paddle.width + 5, 400);
                            createExplosion(ball.x, ball.y);
                            const angle = Math.atan2(dy, dx);
                            whiteBall.vx = Math.cos(angle) * 5;
                            whiteBall.vy = Math.sin(angle) * 5;
                            checkBallSpawn();
                        }
                    }
                });

                // 检测无人机碰撞（白球打中无人机直接获胜）
                drones.forEach((drone, droneIndex) => {
                    const dx = whiteBall.x - drone.x;
                    const dy = whiteBall.y - drone.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < whiteBall.radius + 20) {
                        stopBackgroundMusic();
                        playWinSound();
                        gameState = 'success';
                        gameMessage.textContent = '🎯 完美击杀! 🎯';
                        gameMessage.style.display = 'block';
                        restartBtn.style.display = 'block';
                        createExplosion(drone.x, drone.y);
                    }
                });

                // 检查白球是否掉出底部
                if (whiteBall.y - whiteBall.radius > canvas.height) {
                    stopBackgroundMusic();
                    playLoseSound();
                    gameState = 'gameover';
                    gameMessage.textContent = '失败';
                    gameMessage.style.display = 'block';
                    restartBtn.style.display = 'block';
                }

                // 检查是否所有目标都被打掉
                const allGone = redBalls.every(ball => !ball.visible);
                if (allGone) {
                    stopBackgroundMusic();
                    playWinSound();
                    gameState = 'success';
                    gameMessage.textContent = '🎉 完美通关! 🎉';
                    gameMessage.style.display = 'block';
                    restartBtn.style.display = 'block';
                }
            }
        }

        // 绘制游戏
        function draw() {
            drawBackground();
            drawRedBalls();
            drawExplosions();
            drawBombs();
            drawDrones();
            drawBullets();
            drawSmallBalls();
            drawPaddle();
            drawWhiteBall();
        }

        // 游戏循环
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 创建爆炸效果
        function createExplosion(x, y, isBomb = false) {
            const particles = [];
            const colors = ['255, 215, 0', '255, 165, 0', '255, 69, 0', '255, 255, 255'];
            const bombColors = ['255, 100, 0', '255, 150, 0', '255, 50, 0', '255, 200, 50', '255, 255, 255'];
            const particleColors = isBomb ? bombColors : colors;
            const particleCount = isBomb ? 50 : 20;

            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i;
                const speed = isBomb ? 3 + Math.random() * 6 : 2 + Math.random() * 4;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: isBomb ? 4 + Math.random() * 6 : 3 + Math.random() * 5,
                    color: particleColors[Math.floor(Math.random() * particleColors.length)],
                    alpha: 1,
                    gravity: isBomb ? 0.15 : 0.1
                });
            }

            explosions.push({
                particles: particles,
                age: 0,
                isBomb: isBomb
            });
        }

        // 更新爆炸效果
        function updateExplosions() {
            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                exp.age++;

                exp.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity || 0.1;
                    p.alpha -= exp.isBomb ? 0.015 : 0.02;
                    p.radius *= 0.97;

                    // 炸弹爆炸时粒子会闪烁
                    if (exp.isBomb && p.alpha > 0.5) {
                        p.radius *= (0.95 + Math.random() * 0.1);
                    }
                });

                const maxAge = exp.isBomb ? 70 : 50;
                if (exp.age > maxAge || exp.particles.every(p => p.alpha <= 0)) {
                    explosions.splice(i, 1);
                }
            }
        }

        // 检查是否需要生成小白球
        function checkBallSpawn() {
            const broken = redBalls.filter(ball => !ball.visible).length;
            const quarter = Math.floor(totalRedBalls / 4);
            
            for (let i = 0; i < 3; i++) {
                const threshold = quarter * (i + 1);
                if (broken >= threshold && !ballsSpawned[i]) {
                    ballsSpawned[i] = true;
                    playSpawnBallSound();
                    smallBalls.push({
                        x: canvas.width / 2,
                        y: canvas.height / 3,
                        radius: BALL_RADIUS * 0.7,
                        vx: (Math.random() - 0.5) * 6,
                        vy: 2 + Math.random() * 2
                    });
                }
            }
        }

        // 更新小白球
        function updateSmallBalls() {
            for (let i = smallBalls.length - 1; i >= 0; i--) {
                const ball = smallBalls[i];
                ball.vy += GRAVITY;
                ball.x += ball.vx;
                ball.y += ball.vy;
                
                if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                    playWallSound();
                    ball.vx = -ball.vx;
                }
                
                if (ball.y - ball.radius < 0) {
                    playWallSound();
                    ball.vy = -ball.vy;
                }
                
                // 挡板碰撞
                if (ball.y + ball.radius > paddle.y &&
                    ball.y - ball.radius < paddle.y + paddle.height &&
                    ball.x > paddle.x &&
                    ball.x < paddle.x + paddle.width) {
                    
                    playPaddleSound();
                    ball.vy = BOUNCE_POWER;
                    const hitPos = (ball.x - paddle.x) / paddle.width;
                    ball.vx = (hitPos - 0.5) * 8;
                    ball.y = paddle.y - ball.radius;
                }
                
                // 检测目标碰撞
                redBalls.forEach(redBall => {
                    if (redBall.visible) {
                        const dx = ball.x - redBall.x;
                        const dy = ball.y - redBall.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < ball.radius + redBall.radius) {
                            redBall.visible = false;
                            playHitSound();
                            playExplosionSound();
                            playGrowSound();
                            paddle.width = Math.min(paddle.width + 5, 400);
                            createExplosion(redBall.x, redBall.y);
                            
                            const angle = Math.atan2(dy, dx);
                            ball.vx = Math.cos(angle) * 5;
                            ball.vy = Math.sin(angle) * 5;
                            
                            checkBallSpawn();
                        }
                    }
                });
                
                if (ball.y - ball.radius > canvas.height) {
                    smallBalls.splice(i, 1);
                }
            }
        }

        // 更新炸弹
        function updateBombs() {
            const brokenBalls = redBalls.filter(ball => !ball.visible).length;

            // 只有当没有无人机时才生成普通炸弹
            const hasDrones = drones.length > 0;
            if (brokenBalls >= totalRedBalls / 3 && !hasDrones) {
                bombSpawnTimer++;
                if (bombSpawnTimer >= 180 && Math.random() < 0.3) {
                    bombs.push({
                        x: 50 + Math.random() * (canvas.width - 100),
                        y: -30,
                        radius: 5,
                        speed: 2 + Math.random() * 2
                    });
                    bombSpawnTimer = 0;
                }
            }

            for (let i = bombs.length - 1; i >= 0; i--) {
                const bomb = bombs[i];

                // 如果是无人机投放的导弹，跟踪挡板位置
                if (bomb.isDroneMissile) {
                    const targetX = paddle.x + paddle.width / 2;
                    const dx = targetX - bomb.x;
                    const horizontalSpeed = Math.abs(dx) * 0.03; // 跟踪速度，比挡板慢
                    
                    if (Math.abs(dx) > 1) {
                        bomb.x += Math.sign(dx) * Math.min(horizontalSpeed, 3);
                    }
                }

                bomb.y += bomb.speed;

                if (bomb.y + bomb.radius > paddle.y &&
                    bomb.y - bomb.radius < paddle.y + paddle.height &&
                    bomb.x + bomb.radius > paddle.x &&
                    bomb.x - bomb.radius < paddle.x + paddle.width) {

                    playBombSound();
                    playExplosionSound();
                    playShrinkSound();
                    paddle.width = Math.max(paddle.width * 0.75, 50);
                    createExplosion(bomb.x, bomb.y, true);
                    bombs.splice(i, 1);
                    continue;
                }

                if (bomb.y - bomb.radius > canvas.height) {
                    bombs.splice(i, 1);
                }
            }
        }

        // 更新无人机和导弹
        function updateDronesAndBullets() {
            const brokenBalls = redBalls.filter(ball => !ball.visible).length;
            const progress = brokenBalls / totalRedBalls;

            // 当进度超过50%时，开始生成无人机
            if (progress > 0.5) {
                droneSpawnTimer++;
                if (droneSpawnTimer >= 200 && drones.length < 2) {
                    drones.push({
                        x: Math.random() * (canvas.width - 100) + 50,
                        y: 100 + Math.random() * 100,
                        rotation: 0,
                        direction: Math.random() > 0.5 ? 1 : -1,
                        shootTimer: 0,
                        scale: 0.34
                    });
                    droneSpawnTimer = 0;
                }
            }

            // 更新无人机
            for (let i = drones.length - 1; i >= 0; i--) {
                const drone = drones[i];

                // 水平移动（加快速度）
                drone.x += drone.direction * 2.5;

                // 螺旋桨旋转
                drone.rotation += 0.3;

                // 边界反弹
                if (drone.x < 50 || drone.x > canvas.width - 50) {
                    drone.direction *= -1;
                }

                // 投弹计时
                drone.shootTimer++;
                if (drone.shootTimer >= 200) {
                    // 播放导弹下落呼啸声
                    playMissileFallSound();
                    // 投放导弹（缩小尺寸）
                    bombs.push({
                        x: drone.x,
                        y: drone.y + 45,
                        radius: 6,
                        speed: 3 + Math.random() * 2,
                        isDroneMissile: true
                    });
                    drone.shootTimer = 0;
                }
            }

            // 更新子弹（保留，以防有其他用途）
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.y += bullet.vy;

                // 检测子弹与挡板碰撞
                if (bullet.y + 4 > paddle.y &&
                    bullet.y - 4 < paddle.y + paddle.height &&
                    bullet.x > paddle.x &&
                    bullet.x < paddle.x + paddle.width) {

                    // 挡板被击中
                    paddle.width = Math.max(paddle.width * 0.95, 50);
                    bullets.splice(i, 1);
                    continue;
                }

                // 子弹出界
                if (bullet.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                leftPressed = true;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                rightPressed = true;
            }
            if ((e.key === ' ' || e.key === 'Enter') && gameState === 'waiting') {
                launchBall();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                leftPressed = false;
            }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                rightPressed = false;
            }
        });

        // 开始游戏按钮事件监听器已移除,使用onclick属性
        // 重新开始按钮事件监听器已移除,使用onclick属性

        // 设置默认选中的主题
        document.querySelector('#themeOptions .paddleOption[data-theme="emoji"]').style.borderColor = '#fff';
        
        // 初始化游戏但不开始
        initGame();
        
        // 启动游戏循环
        gameLoop();
    </script>
</body>
