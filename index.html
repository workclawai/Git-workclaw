<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 潮流弹球</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            display: block;
            background: #0d0d1a;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(102, 126, 234, 0.5), 0 0 100px rgba(118, 75, 162, 0.3);
        }
        #gameMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 64px;
            font-weight: 900;
            text-align: center;
            display: none;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 40px rgba(102, 126, 234, 0.8);
            letter-spacing: 4px;
        }
        #restartBtn {
            position: absolute;
            padding: 18px 50px;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: none;
        }
        #restartBtn:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        #startBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }
        #paddleSelector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        #paddleSelector h2 {
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        #paddleOptions {
            display: flex;
            gap: 20px;
        }
        .paddleOption {
            width: 120px;
            height: 90px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
        }
        .paddleOption:hover {
            transform: scale(1.1);
            border-color: #fff;
        }
        .paddleOption.neon {
            background: linear-gradient(135deg, #00f260, #0575e6);
        }
        .paddleOption.cyber {
            background: linear-gradient(135deg, #f857a6, #ff5858);
        }
        .paddleOption.cosmic {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .paddleOption.pastel {
            background: linear-gradient(135deg, #a8e063, #56ab2f);
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="1000" height="800"></canvas>
        
        <div id="paddleSelector">
            <h2>选择你的挡板</h2>
            <div id="paddleOptions">
                <div class="paddleOption neon" data-style="neon">
                    <div style="font-size: 30px;">⚡</div>
                    霓虹
                </div>
                <div class="paddleOption cyber" data-style="cyber">
                    <div style="font-size: 30px;">🤖</div>
                    赛博
                </div>
                <div class="paddleOption cosmic" data-style="cosmic">
                    <div style="font-size: 30px;">🌌</div>
                    宇宙
                </div>
                <div class="paddleOption pastel" data-style="pastel">
                    <div style="font-size: 30px;">🌸</div>
                    糖果
                </div>
            </div>
            <h2 style="margin-top: 15px;">选择游戏主题</h2>
            <div id="themeOptions" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 800px;">
                <div class="paddleOption" data-theme="emoji" style="background: linear-gradient(135deg, #f093fb, #f5576c); width: 120px; height: 90px; font-size: 14px;">
                    <div style="font-size: 26px;">😀</div>
                    Emoji
                </div>
                <div class="paddleOption" data-theme="fruit" style="background: linear-gradient(135deg, #fa709a, #fee140); width: 120px; height: 90px; font-size: 14px;">
                    <div style="font-size: 26px;">🍎</div>
                    水果
                </div>
                <div class="paddleOption" data-theme="veggie" style="background: linear-gradient(135deg, #4facfe, #00f2fe); width: 120px; height: 90px; font-size: 14px;">
                    <div style="font-size: 26px;">🥕</div>
                    蔬菜
                </div>
                <div class="paddleOption" data-theme="animal" style="background: linear-gradient(135deg, #a8edea, #fed6e3); color: #333; width: 120px; height: 90px; font-size: 14px;">
                    <div style="font-size: 26px;">🐱</div>
                    动物
                </div>
                <div class="paddleOption" data-theme="labubu" style="background: linear-gradient(135deg, #667eea, #764ba2); width: 120px; height: 90px; font-size: 14px;">
                    <div style="font-size: 26px;">👹</div>
                    拉布布
                </div>
                <div class="paddleOption" data-theme="goose" style="background: linear-gradient(135deg, #f093fb, #f5576c); width: 120px; height: 90px; font-size: 14px;">
                    <div style="font-size: 26px;">🦢</div>
                    大鹅
                </div>
            </div>
            <button id="startBtn" onclick="startGame()" style="margin-top: 15px; padding: 12px 40px; font-size: 18px; font-weight: 700; color: white; border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); transition: all 0.3s ease; font-family: 'Poppins', sans-serif; text-transform: uppercase; letter-spacing: 1px; background: linear-gradient(135deg, #667eea, #764ba2);">开始游戏</button>
        </div>

        <div id="gameMessage"></div>
        <button id="restartBtn" onclick="restartGame()">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameMessage = document.getElementById('gameMessage');
        const restartBtn = document.getElementById('restartBtn');
        const startBtn = document.getElementById('startBtn');
        const paddleSelector = document.getElementById('paddleSelector');

        // 音频上下文
        let audioCtx = null;
        let bgMusicNodes = [];
        let bgMusicGain = null;
        let isMusicPlaying = false;
        let currentBeat = 0;
        let lastBeatTime = 0;

        // 音量设置
        const SFX_VOLUME = 0.25; // 音效音量（较高）
        const BG_MUSIC_VOLUME = 0.08; // 背景音乐音量（较低，不干扰音效）
        const BPM = 128; // 节拍速度（现代电子音乐常用）
        const BEAT_DURATION = 60 / BPM; // 每拍的时长

        // 现代电子音乐和弦进行
        const chordProgression = [
            [261.63, 329.63, 392.00],  // Cm: C, E, G
            [293.66, 369.99, 440.00],  // D: D, F#, A
            [349.23, 440.00, 523.25],  // F: F, A, C
            [392.00, 493.88, 587.33]   // G: G, B, D
        ];
        const bassNotes = [130.81, 146.83, 174.61, 196.00]; // 低音根音 C2, D2, F2, G2

        // 初始化音频
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgMusicGain = audioCtx.createGain();
                bgMusicGain.gain.value = 0;
                bgMusicGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 启动背景音乐
        function startBackgroundMusic() {
            initAudio();
            if (isMusicPlaying) return;
            isMusicPlaying = true;
            
            // 渐入音乐
            bgMusicGain.gain.linearRampToValueAtTime(BG_MUSIC_VOLUME, audioCtx.currentTime + 0.5);
            
            // 开始循环
            scheduleNextBeat();
        }

        // 停止背景音乐
        function stopBackgroundMusic() {
            if (!isMusicPlaying) return;
            isMusicPlaying = false;
            
            // 渐出音乐
            bgMusicGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            
            // 清除所有正在播放的音乐节点
            setTimeout(() => {
                bgMusicNodes.forEach(node => {
                    try {
                        node.stop();
                    } catch (e) {}
                });
                bgMusicNodes = [];
            }, 400);
        }

        // 调度下一拍
        function scheduleNextBeat() {
            if (!isMusicPlaying) return;
            
            const now = audioCtx.currentTime;
            
            // 计算应该在什么时间播放下一拍
            if (lastBeatTime === 0) {
                lastBeatTime = now;
            } else {
                // 确保节拍准确
                const elapsed = now - lastBeatTime;
                if (elapsed < BEAT_DURATION) {
                    setTimeout(scheduleNextBeat, (BEAT_DURATION - elapsed) * 1000);
                    return;
                }
                lastBeatTime = now;
            }
            
            // 播放当前拍
            playBeat(currentBeat);
            
            // 更新拍数
            currentBeat = (currentBeat + 1) % 16; // 4小节循环（每小节4拍）
            
            // 调度下一拍
            setTimeout(scheduleNextBeat, BEAT_DURATION * 1000);
        }

        // 播放一拍
        function playBeat(beatNumber) {
            if (!audioCtx || !isMusicPlaying) return;
            
            const bar = Math.floor(beatNumber / 4) % 4; // 0-3 (4小节循环)
            const beatInBar = beatNumber % 4; // 0-3
            
            // 节拍声（Kick）
            if (beatInBar === 0 || beatInBar === 2) {
                playKick(beatInBar === 0);
            }
            
            // Hi-hat（每半拍一个）
            playHiHat(beatNumber % 8 === 0);
            
            // Snare（第2和第4拍）
            if (beatInBar === 1 || beatInBar === 3) {
                playSnare(beatInBar === 1);
            }
            
            // Bass（每个小节的第一拍）
            if (beatInBar === 0) {
                playBass(bar);
            }
            
            // 和弦（第一小节和第三小节）
            if (bar === 0 || bar === 2) {
                if (beatInBar === 0) {
                    playChord(bar);
                } else if (beatInBar === 2) {
                    playChord(bar);
                }
            }
            
            // 合成器琶音（第二小节和第四小节）
            if (bar === 1 || bar === 3) {
                if (beatInBar === 0 || beatInBar === 1 || beatInBar === 2 || beatInBar === 3) {
                    playArpeggio(bar, beatInBar);
                }
            }
        }

        // Kick 鼓
        function playKick(heavy) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(bgMusicGain);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
            
            const volume = heavy ? 0.4 : 0.3;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.2);
            
            bgMusicNodes.push(osc);
        }

        // Snare 鼓
        function playSnare(heavy) {
            // Noise component
            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 800;
            
            const noiseGain = audioCtx.createGain();
            const volume = heavy ? 0.2 : 0.15;
            noiseGain.gain.setValueAtTime(volume, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(bgMusicGain);
            
            noise.start(audioCtx.currentTime);
            noise.stop(audioCtx.currentTime + 0.1);
            
            bgMusicNodes.push(noise);
        }

        // Hi-hat
        function playHiHat(accent) {
            const bufferSize = audioCtx.sampleRate * 0.05;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 6000;
            
            const gain = audioCtx.createGain();
            const volume = accent ? 0.08 : 0.05;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(bgMusicGain);
            
            noise.start(audioCtx.currentTime);
            noise.stop(audioCtx.currentTime + 0.05);
            
            bgMusicNodes.push(noise);
        }

        // Bass
        function playBass(bar) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(bgMusicGain);
            
            osc.type = 'sawtooth';
            const freq = bassNotes[bar];
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(freq * 0.98, audioCtx.currentTime + 0.3);
            
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.3);
            
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.4);
            
            bgMusicNodes.push(osc);
        }

        // 和弦
        function playChord(bar) {
            const chord = chordProgression[bar % 4];
            
            chord.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const filter = audioCtx.createBiquadFilter();
                
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(bgMusicGain);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(2000, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.5);
                
                const volume = 0.08 - index * 0.01;
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
                
                osc.start(audioCtx.currentTime + index * 0.02);
                osc.stop(audioCtx.currentTime + 0.6 + index * 0.02);
                
                bgMusicNodes.push(osc);
            });
        }

        // 琶音
        function playArpeggio(bar, beatInBar) {
            const chord = chordProgression[bar % 4];
            const noteIndex = beatInBar % chord.length;
            const freq = chord[noteIndex] * 2; // 高八度
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(bgMusicGain);
            
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.15);
            
            bgMusicNodes.push(osc);
        }

        // 播放击打目标音效（短促清脆）
        function playHitSound() {
            if (!audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(SFX_VOLUME, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        // 播放挡板碰撞音效（弹性回弹）
        function playPaddleSound() {
            if (!audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(SFX_VOLUME * 0.8, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        // 播放墙壁碰撞音效（清脆）
        function playWallSound() {
            if (!audioCtx) return;
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(SFX_VOLUME * 0.6, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        // 播放爆炸音效（震撼）
        function playExplosionSound() {
            if (!audioCtx) return;

            // 创建多层噪声
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer1 = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const buffer2 = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data1 = buffer1.getChannelData(0);
            const data2 = buffer2.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                data1[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.08));
                data2[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.12));
            }

            // 第一层：低频轰鸣
            const noiseSource1 = audioCtx.createBufferSource();
            noiseSource1.buffer = buffer1;

            const filter1 = audioCtx.createBiquadFilter();
            filter1.type = 'lowpass';
            filter1.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter1.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.5);

            const gain1 = audioCtx.createGain();
            gain1.gain.setValueAtTime(SFX_VOLUME * 2.0, audioCtx.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            noiseSource1.connect(filter1);
            filter1.connect(gain1);
            gain1.connect(audioCtx.destination);

            // 第二层：中频炸裂
            const noiseSource2 = audioCtx.createBufferSource();
            noiseSource2.buffer = buffer2;

            const filter2 = audioCtx.createBiquadFilter();
            filter2.type = 'bandpass';
            filter2.frequency.setValueAtTime(1500, audioCtx.currentTime);
            filter2.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.3);
            filter2.Q.value = 5;

            const gain2 = audioCtx.createGain();
            gain2.gain.setValueAtTime(SFX_VOLUME * 1.5, audioCtx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            noiseSource2.connect(filter2);
            filter2.connect(gain2);
            gain2.connect(audioCtx.destination);

            // 第三层：冲击波低频
            const impactOsc = audioCtx.createOscillator();
            const impactGain = audioCtx.createGain();
            impactOsc.connect(impactGain);
            impactGain.connect(audioCtx.destination);

            impactOsc.type = 'sine';
            impactOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
            impactOsc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.4);

            impactGain.gain.setValueAtTime(SFX_VOLUME * 1.8, audioCtx.currentTime);
            impactGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

            impactOsc.start(audioCtx.currentTime);
            impactOsc.stop(audioCtx.currentTime + 0.4);

            noiseSource1.start(audioCtx.currentTime);
            noiseSource2.start(audioCtx.currentTime);
        }

        // 播放炸弹音效（炸裂）
        function playBombSound() {
            if (!audioCtx) return;

            // 第一层：低频冲击波
            const impactOsc = audioCtx.createOscillator();
            const impactGain = audioCtx.createGain();
            impactOsc.connect(impactGain);
            impactGain.connect(audioCtx.destination);

            impactOsc.type = 'sawtooth';
            impactOsc.frequency.setValueAtTime(100, audioCtx.currentTime);
            impactOsc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.5);

            impactGain.gain.setValueAtTime(SFX_VOLUME * 1.8, audioCtx.currentTime);
            impactGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            impactOsc.start(audioCtx.currentTime);
            impactOsc.stop(audioCtx.currentTime + 0.5);

            // 第二层：中频炸裂声
            const crackOsc = audioCtx.createOscillator();
            const crackGain = audioCtx.createGain();
            crackOsc.connect(crackGain);
            crackGain.connect(audioCtx.destination);

            crackOsc.type = 'square';
            crackOsc.frequency.setValueAtTime(200, audioCtx.currentTime);
            crackOsc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.3);

            crackGain.gain.setValueAtTime(SFX_VOLUME * 1.2, audioCtx.currentTime);
            crackGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            crackOsc.start(audioCtx.currentTime);
            crackOsc.stop(audioCtx.currentTime + 0.3);

            // 第三层：高频尖锐声
            const sharpOsc = audioCtx.createOscillator();
            const sharpGain = audioCtx.createGain();
            sharpOsc.connect(sharpGain);
            sharpGain.connect(audioCtx.destination);

            sharpOsc.type = 'triangle';
            sharpOsc.frequency.setValueAtTime(800, audioCtx.currentTime);
            sharpOsc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);

            sharpGain.gain.setValueAtTime(SFX_VOLUME * 0.8, audioCtx.currentTime);
            sharpGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            sharpOsc.start(audioCtx.currentTime);
            sharpOsc.stop(audioCtx.currentTime + 0.2);
        }

        // 播放导弹下落呼啸声
        function playMissileFallSound() {
            if (!audioCtx) return;

            // 第一层：啸叫声音（高频）
            const whooshOsc = audioCtx.createOscillator();
            const whooshGain = audioCtx.createGain();
            whooshOsc.connect(whooshGain);
            whooshGain.connect(audioCtx.destination);

            whooshOsc.type = 'sawtooth';
            whooshOsc.frequency.setValueAtTime(800, audioCtx.currentTime);
            whooshOsc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.8);

            whooshGain.gain.setValueAtTime(SFX_VOLUME * 2.5, audioCtx.currentTime);
            whooshGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);

            whooshOsc.start(audioCtx.currentTime);
            whooshOsc.stop(audioCtx.currentTime + 0.8);

            // 第二层：风声噪声
            const bufferSize = audioCtx.sampleRate * 0.6;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const noiseData = noiseBuffer.getChannelData(0);

            for (let i = 0; i < bufferSize; i++) {
                noiseData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.15));
            }

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            noiseFilter.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.6);
            noiseFilter.Q.value = 3;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(SFX_VOLUME * 1.8, audioCtx.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

            noiseSource.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);

            noiseSource.start(audioCtx.currentTime);
        }

        // 初始化游戏

            weather = weatherTypes[Math.floor(Math.random() * weatherTypes.length)];

            weatherParticles = [];

                for (let i = 0; i < 100; i++) {

                        y: Math.random() * canvas.height,
                        speed: 5 + Math.random() * 5,
                        length: 10 + Math.random() * 20
                    });
                }
            } else if (weather === 'snow') {
                for (let i = 0; i < 80; i++) {
                    weatherParticles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        speed: 1 + Math.random() * 2,
                        radius: 2 + Math.random() * 3,
                        drift: Math.random() * 2 - 1
